<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Kompas Tumbuh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-space { font-family: 'Space Grotesk', sans-serif; }
        .glass-panel {
            background: rgba(255,255,255,0.45);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.3);
        }
        .dark .glass-panel {
            background: rgba(9,15,30,0.65);
            border: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 transition-colors duration-500">
    <div class="w-full max-w-md glass-panel rounded-3xl p-8 shadow-2xl border border-slate-200/50 dark:border-slate-800/50">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-tr from-cyan-500 to-indigo-600 rounded-2xl flex items-center justify-center text-3xl mx-auto shadow-lg shadow-cyan-500/10">🧭</div>
            <h1 class="text-2xl font-black font-space mt-4 text-slate-900 dark:text-white">Kompas Tumbuh</h1>
            <p class="text-xs text-slate-500 mt-1">Sistem Evaluasi Psikososial LPKA Pangkalpinang</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold font-space text-slate-400 uppercase tracking-wider mb-1.5">Email Enumerator</label>
                <input type="email" id="login-email" class="w-full px-4 py-3 text-sm rounded-xl bg-white/60 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 focus:outline-none focus:ring-2 focus:ring-cyan-500" placeholder="email@example.com" required>
            </div>
            <div>
                <label class="block text-xs font-bold font-space text-slate-400 uppercase tracking-wider mb-1.5">Kata Sandi</label>
                <input type="password" id="login-password" class="w-full px-4 py-3 text-sm rounded-xl bg-white/60 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 focus:outline-none focus:ring-2 focus:ring-cyan-500" placeholder="••••••••" required>
            </div>
            <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-600 hover:to-indigo-700 text-white font-bold font-space text-sm transition-all active:scale-[0.98] shadow-lg shadow-cyan-500/10">
                🚪 Masuk ke Dashboard
            </button>
            <p id="login-error" class="text-xs text-rose-500 text-center hidden">Email atau kata sandi salah.</p>
        </form>

        <p class="text-[10px] text-slate-400 text-center mt-6">Akses terbatas untuk enumerator terdaftar.</p>
    </div>

    <script>
        const SUPABASE_URL = "https://ovykmdunxsgtmcuszsuc.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92eWttZHVueHNndG1jdXN6c3VjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxMDQzODYsImV4cCI6MjA5ODY4MDM4Nn0.UQjcbkhx4UgpIpVpJoEq3zEQOQgIDDBr3b0N2DZv2WI";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Cek jika sudah login, redirect ke dashboard
        supabaseClient.auth.getSession().then(({ data }) => {
            if (data.session) {
                window.location.href = 'dashboard.html';
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');

            // Reset error
            errorEl.classList.add('hidden');

            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            
            if (error) {
                errorEl.classList.remove('hidden');
                errorEl.innerText = '❌ ' + error.message;
                console.error('Login error:', error);
            } else {
                // Redirect ke dashboard dengan delay kecil
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
